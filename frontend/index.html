<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three-Tier Docker Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .message-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .message-text {
            font-size: 18px;
            line-height: 1.6;
        }
        
        .loading {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .info-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .info-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .architecture {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .tier {
            text-align: center;
            padding: 10px;
            margin: 5px;
        }
        
        .tier-icon {
            width: 60px;
            height: 60px;
            background: #f0f0f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
        }
        
        .tier-name {
            font-size: 12px;
            color: #666;
        }
        
        .status {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
        }
        
        .status-indicator.active {
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .timestamp {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐳 Three-Tier Docker Application</h1>
        <p class="subtitle">Frontend → Backend (Python Flask) → Database (PostgreSQL)</p>
        
        <div class="message-box">
            <div id="message" class="message-text loading">Loading message from database...</div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <button onclick="fetchMessage()">Refresh Message</button>
        
        <div class="timestamp" id="timestamp"></div>
        
        <div class="info-section">
            <div class="info-title">Application Architecture</div>
            <div class="architecture">
                <div class="tier">
                    <div class="tier-icon">🌐</div>
                    <div class="tier-name">Frontend<br>(Nginx)</div>
                </div>
                <div class="tier">
                    <div class="tier-icon">🐍</div>
                    <div class="tier-name">Backend<br>(Python Flask)</div>
                </div>
                <div class="tier">
                    <div class="tier-icon">🗄️</div>
                    <div class="tier-name">Database<br>(PostgreSQL)</div>
                </div>
            </div>
            
            <div class="status">
                <div class="status-item">
                    <span class="status-indicator" id="frontend-status"></span>
                    <span>Frontend</span>
                </div>
                <div class="status-item">
                    <span class="status-indicator" id="backend-status"></span>
                    <span>Backend</span>
                </div>
                <div class="status-item">
                    <span class="status-indicator" id="database-status"></span>
                    <span>Database</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const BACKEND_URL = '/api';  // Nginx will proxy this to the backend
        
        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                `Last updated: ${now.toLocaleTimeString()}`;
        }
        
        // Fetch message from backend
        async function fetchMessage() {
            const messageElement = document.getElementById('message');
            const errorElement = document.getElementById('error');
            const frontendStatus = document.getElementById('frontend-status');
            const backendStatus = document.getElementById('backend-status');
            const databaseStatus = document.getElementById('database-status');
            
            // Reset status indicators
            frontendStatus.classList.remove('active');
            backendStatus.classList.remove('active');
            databaseStatus.classList.remove('active');
            
            // Frontend is active if this code is running
            frontendStatus.classList.add('active');
            
            try {
                messageElement.textContent = 'Fetching message from backend...';
                messageElement.classList.add('loading');
                errorElement.style.display = 'none';
                
                // Fetch from backend API
                const response = await fetch(`${BACKEND_URL}/message`);
                
                if (!response.ok) {
                    throw new Error(`Backend returned status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Backend responded successfully
                backendStatus.classList.add('active');
                
                if (data.success && data.data) {
                    // Database query was successful
                    databaseStatus.classList.add('active');
                    
                    messageElement.textContent = data.data.text;
                    messageElement.classList.remove('loading');
                    
                    // Show when the message was created
                    if (data.data.created_at) {
                        const created = new Date(data.data.created_at);
                        console.log('Message created at:', created.toLocaleString());
                    }
                } else {
                    throw new Error(data.message || 'No data received from backend');
                }
                
                updateTimestamp();
                
            } catch (error) {
                console.error('Error:', error);
                messageElement.textContent = 'Failed to load message';
                messageElement.classList.remove('loading');
                
                errorElement.textContent = `Error: ${error.message}. Make sure all Docker containers are running.`;
                errorElement.style.display = 'block';
            }
        }
        
        // Check backend health
        async function checkHealth() {
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                const data = await response.json();
                console.log('Health check:', data);
            } catch (error) {
                console.error('Health check failed:', error);
            }
        }
        
        // Initial load
        window.addEventListener('load', () => {
            fetchMessage();
            checkHealth();
            
            // Periodically check health
            setInterval(checkHealth, 30000); // Every 30 seconds
        });
    </script>
</body>
</html>
