apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: three-tier-app-backend:latest
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: database
            - name: DB_NAME
              value: appdb
            - name: DB_USER
              value: dbuser
            - name: DB_PASSWORD
              value: password123
          ports:
            - containerPort: 5000